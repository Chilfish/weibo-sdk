shellEmulator: true

trustPolicy: no-downgrade
packages:
  - .

catalog:
  axios: ^1.19.0
  citty: ^0.2.2
  zod: ^4.4.3

catalogs:
  cli:
    '@antfu/eslint-config': ^9.3.0
    '@antfu/ni': ^30.5.0
    bumpp: ^12.2.0
    dotenv: 17.4.2
    eslint: ^10.8.1
    lint-staged: ^17.3.0
    simple-git-hooks: ^2.13.1
    tsx: ^4.23.11
    typescript: 6.0.3
    vite: ^8.2.1
  testing:
    vitest: ^4.1.10
    vitest-package-exports: ^1.2.0
    yaml: ^2.9.0
  types:
    '@types/node': ^26.2.0
  utils:
    '@size-limit/preset-small-lib': ^13.0.3
    tinyexec: ^1.3.0
    tsdown: ^0.22.14

onlyBuiltDependencies:
  - esbuild
  - simple-git-hooks

allowBuilds:
  esbuild: true
  simple-git-hooks: true
