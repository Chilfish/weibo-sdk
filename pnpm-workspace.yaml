  - docs
  - packages/*
  - examples

catalog:
  axios: ^1.13.2
  dotenv: ^17.2.3
  tsup: ^8.5.1
  winston: ^3.19.0
  zod: ^4.2.1

catalogs:
  cli:
    '@antfu/eslint-config': ^6.7.3
    '@antfu/ni': ^28.0.0
    bumpp: ^10.3.2
    eslint: ^9.39.2
    lint-staged: ^16.2.7
    simple-git-hooks: ^2.13.1
    tsx: ^4.21.0
    typescript: ^5.9.3
    unbuild: ^3.6.1
    vite: ^7.3.0
  testing:
    vitest: ^4.0.16
    vitest-package-exports: ^1.1.1
