shellEmulator: true

trustPolicy: no-downgrade
packages:
  - .

catalog:
  axios: ^1.16.1
  citty: ^0.2.2
  zod: ^4.4.3

catalogs:
  cli:
    '@antfu/eslint-config': ^9.0.0
    '@antfu/ni': ^30.1.0
    bumpp: ^11.1.0
    dotenv: 17.4.2
    eslint: ^10.4.0
    lint-staged: ^17.0.5
    simple-git-hooks: ^2.13.1
    tsx: ^4.22.0
    typescript: ^6.0.3
    vite: ^8.0.13
  testing:
    vitest: ^4.1.6
    vitest-package-exports: ^1.2.0
    yaml: ^2.9.0
  types:
    '@types/node': ^25.8.0
  utils:
    '@size-limit/preset-small-lib': ^12.1.0
    tinyexec: ^1.1.2
    tsdown: ^0.22.0

onlyBuiltDependencies:
  - esbuild
  - simple-git-hooks

allowBuilds:
  esbuild: true
  simple-git-hooks: true
