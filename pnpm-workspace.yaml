minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@vitest/mocker@5.0.0'
  - '@vitest/spy@5.0.0'
  - rolldown-plugin-dts@0.28.5
  - tinyexec@1.3.1
  - tsdown@0.23.0
  - vitest@5.0.0

trustPolicy: no-downgrade
shellEmulator: true

packages:
  - .

allowBuilds:
  esbuild: true
  simple-git-hooks: true

onlyBuiltDependencies:
  - esbuild
  - simple-git-hooks

catalog:
  axios: ^1.20.0
  citty: ^0.2.2
  zod: ^4.5.4

catalogs:
  cli:
    '@antfu/eslint-config': ^9.5.1
    '@antfu/ni': ^30.5.0
    bumpp: ^12.3.0
    dotenv: 17.4.2
    eslint: ^10.9.1
    lint-staged: ^17.4.1
    simple-git-hooks: ^2.14.0
    tsx: ^4.23.13
    typescript: 6.0.3
    vite: ^8.2.2
  testing:
    vitest: ^5.0.0
    vitest-package-exports: ^1.2.0
    yaml: ^2.9.0
  types:
    '@types/node': ^26.4.1
  utils:
    '@size-limit/preset-small-lib': ^13.0.3
    tinyexec: ^1.3.1
    tsdown: ^0.23.0
