name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          # 不配置 registry-url：避免 setup-node 写入指向 NODE_AUTH_TOKEN 的 .npmrc，
          # pnpm 会通过 OIDC（Trusted Publisher）换取短期凭据。
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Resolve version
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
        env:
          TAG: ${{ github.ref_name }}

      - name: Verify tag matches package.json
        run: node scripts/verify-release-tag.mjs "${{ github.ref_name }}"

      - run: pnpm run typecheck
      - run: pnpm exec eslint .
      - run: pnpm test --run
      - run: pnpm run validate:fixtures
      - run: pnpm check:api
      - run: pnpm check:docs
      - run: pnpm run schema:check
      - run: pnpm run build
      - run: pnpm docs:build
      - run: node scripts/browser-smoke.mjs --no-browser

      - name: Publish to npm
        run: |
          if npm view "@chilfish/weibo-sdk@$VERSION" version >/dev/null 2>&1; then
            echo "@chilfish/weibo-sdk@$VERSION 已存在，跳过发布（重跑场景）"
          else
            pnpm publish --no-git-checks --access public --provenance
          fi

      - name: Verify registry
        run: |
          for attempt in $(seq 1 30); do
            if npm view "@chilfish/weibo-sdk@$VERSION" version; then
              exit 0
            fi
            echo "registry 尚未可安装（第 $attempt 次），10s 后重试"
            sleep 10
          done
          echo "✖ registry 在 300s 内没有出现 @chilfish/weibo-sdk@$VERSION"
          exit 1
