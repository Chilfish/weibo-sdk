name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 20 是 engines.node 声称的下限（>=20.16），必须实测；24 是当前 LTS，26 是即将进入 LTS 的当前版本。
        node: [20, 24, 26]

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck
      # eslint-plugin-unicorn@74 声明 engines.node >=22，并在模块顶层使用
      # Set.prototype.union；在 Node 20 上 lint 会直接崩溃。运行时仍实测 20，
      # 但 lint 只在 Node 24 上跑一次。
      - if: matrix.node == 24
        run: pnpm exec eslint .
      - run: pnpm test --run
      - run: pnpm run validate:fixtures
      - run: pnpm check:api
      - run: pnpm check:docs
      - run: pnpm run schema:check
      - run: pnpm run build
      - run: pnpm run verify:package
      - run: pnpm run test:bundle
      - run: pnpm docs:build
      - run: node scripts/browser-smoke.mjs --no-browser
